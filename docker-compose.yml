services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-service-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ug_smart_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - smart_service_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ug_smart_service_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smart_service_postgres_data: